name: Debug models endpoint

on:
  workflow_dispatch:

permissions:
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe endpoints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          probe() {
            echo "=== $1 ==="
            curl -sS --max-time 45 -o /tmp/body -w "status=%{http_code} type=%{content_type}\n" \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" "${@:2}"
            head -c 300 /tmp/body; echo; echo
          }
          probe "catalog GET models.github.ai" "https://models.github.ai/catalog/models"
          probe "azure legacy POST" "https://models.inference.ai.azure.com/chat/completions" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"reply with: ok"}],"max_tokens":16}'
          probe "models.github.ai POST /inference" "https://models.github.ai/inference/chat/completions" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"reply with: ok"}],"max_tokens":16}'
